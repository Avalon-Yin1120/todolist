# Gradle 发行版地址。
#
# ⚠️ 必须是**官方地址**：这里曾经指向 mirrors.cloud.tencent.com 的镜像，
# 在国内本机很快，但 GitHub Actions 的 runner 在美国，拉不动那个镜像 ——
# CI 会卡 6 分钟左右然后失败（2026-10-21 第一次 CI 就是这么红的）。
#
# 本机（Windows）其实不走这里：`gradlew.bat` 会直接用 D:\Android\gradle-8.11.1，
# 只有 Linux/macOS 的 `./gradlew` 才会按下面的地址下载。
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip
networkTimeout=60000
validateDistributionUrl=false
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists