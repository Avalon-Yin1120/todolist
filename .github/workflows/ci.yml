name: CI

# 只做「代码还能不能编译、单测还过不过」这件事。
# 不签名、不发版：发布走 release.yml（手动触发）或本地 scripts/release.ps1。
#
# 失败时先看「Diagnostics（失败时先看这里）」这一步的输出：
# 它把 JDK / SDK / gradlew 权限 / Gradle 版本先打出来，真正的原因通常就在紧接着的那一步。
on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 与本机一致，避免日期格式化类断言在不同时区下漂移
  TZ: Asia/Shanghai

jobs:
  test:
    name: 单测 + 编译
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不用 android-actions/setup-android：实测在 runner 上 10 秒就红。
      # runner 镜像里已有 Android SDK，这里只用它自带的 sdkmanager 补装组件。
      - name: 准备 Android SDK（platform 35 / build-tools 35）
        run: |
          set -eux
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDK 目录："; ls "$SDK_ROOT" || true

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager 2>/dev/null | head -1 || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "== 预装 SDK 里没有 sdkmanager，下载 commandline-tools =="
            curl -fsSL -o /tmp/tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            mkdir -p /tmp/cmdline-tools
            unzip -q /tmp/tools.zip -d /tmp/cmdline-tools
            SDKMANAGER=/tmp/cmdline-tools/cmdline-tools/bin/sdkmanager
          fi
          echo "SDKMANAGER=$SDKMANAGER"

          yes 2>/dev/null | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          ls "$SDK_ROOT/platforms" "$SDK_ROOT/build-tools"

      - name: gradlew 可执行位兜底
        run: |
          chmod +x gradlew
          ls -l gradlew

      - name: 缓存 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Diagnostics（失败时先看这里）
        run: |
          echo "== 环境 =="
          java -version 2>&1
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "TZ=$TZ"
          date
          echo "== Gradle =="
          ./gradlew --version 2>&1 | head -20

      - name: 单元测试
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: 编译调试包（不签名发布）
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore

      - name: 上传调试包（仅供排查，不是发布件）
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
